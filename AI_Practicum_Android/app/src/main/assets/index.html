const storage=(()=>{
 const memory=new Map(),volatile=new Set();
 function getItem(k){if(volatile.has(k))return memory.has(k)?memory.get(k):null;try{const v=window.localStorage.getItem(k);return v===null&&memory.has(k)?memory.get(k):v}catch(e){return memory.has(k)?memory.get(k):null}}
 function setItem(k,v){const value=String(v);try{window.localStorage.setItem(k,value);memory.set(k,value);volatile.delete(k);return {ok:true,persistent:true}}catch(e){memory.set(k,value);volatile.add(k);return {ok:true,persistent:false,error:e}}}
 function removeItem(k){memory.delete(k);volatile.delete(k);try{window.localStorage.removeItem(k);return {ok:true,persistent:true}}catch(e){return {ok:true,persistent:false}}}
 function setManyAtomic(entries){const pairs=Object.entries(entries).map(([k,v])=>[k,String(v)]);let old=[];try{const ls=window.localStorage;old=pairs.map(([k])=>[k,ls.getItem(k)]);try{for(const [k,v] of pairs)ls.setItem(k,v);for(const [k,v] of pairs){memory.set(k,v);volatile.delete(k)}return {ok:true,persistent:true}}catch(err){for(const [k,v] of old){try{if(v===null)ls.removeItem(k);else ls.setItem(k,v)}catch(_){}}throw err}}catch(err){for(const [k,v] of pairs){memory.set(k,v);volatile.add(k)}return {ok:true,persistent:false,error:err}}}
 return {getItem,setItem,removeItem,setManyAtomic,hasVolatile(){return volatile.size>0}};
})();

function rubricBars(record){

  {name:'1. Требования и анализ',goal:'Уточнить проблему, пользователей, сценарии и границы MVP.',deliverables:['Краткое описание проблемы и цели','Роли пользователей и ключевые сценарии','Функциональные и нефункциональные требования','Список допущений, рисков и открытых вопросов'],checks:['Каждое требование сформулировано однозначно','MVP отделён от пожеланий на будущее','Критерии приёмки проверяемы','Нет выдуманных требований — неопределённости помечены']},

function sanitizeCustomPrompts(items){
 if(!Array.isArray(items))return [];
 const allowedCats=['Разработка','Дизайн','Редактура','Аналитика','Тестирование','DevOps','Исследования','Документация','Автоматизация','Обучение','Другое'];
 const seen=new Set(),out=[];
 for(const x of items){
  if(!x||typeof x!=='object'||typeof x.title!=='string'||typeof x.text!=='string')continue;
  const title=x.title.trim().slice(0,160),text=x.text.trim().slice(0,20000);
  if(!title||!text)continue;
  let id=typeof x.id==='string'?x.id.slice(0,100):'';
  if(!/^c8-[a-zA-Z0-9_-]+$/.test(id)||seen.has(id))id='c8-local-'+Math.random().toString(36).slice(2,10)+'-'+out.length;
  seen.add(id);
  out.push({id,title,cat:allowedCats.includes(x.cat)?x.cat:'Другое',desc:typeof x.desc==='string'?x.desc.trim().slice(0,300):'Мой шаблон',text,custom:true});
  if(out.length>=100)break;
 }
 return out;
}

document.addEventListener('input',e=>{if(e.target.id==='v8-search'){const val=e.target.value;render();const input=$('v8-search');if(input){input.focus();input.setSelectionRange(val.length,val.length)}}});
