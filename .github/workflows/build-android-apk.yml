name: Build AI Practicum APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AI_Practicum_Android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK with Gradle Wrapper
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
        working-directory: AI_Practicum_Android

      - name: Verify APK
        shell: bash
        run: test -s AI_Practicum_Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-practicum-debug-apk
          path: AI_Practicum_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
